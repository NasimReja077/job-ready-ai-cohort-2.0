apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace-ingress

  annotations:
    # Time in seconds to wait for a response from the pod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6000"
    
    # Time in seconds to wait for data to be sent to the pod
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6000"
    
    # Time in seconds to establish a connection to the pod
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "6000"

    # Use cookie-based session affinity to ensure that requests from the same client are routed to the same backend pod
    nginx.ingress.kubernetes.io/affinity: "cookie"

    # Name of the cookie used for session affinity
    nginx.ingress.kubernetes.io/session-cookie-name: "route"

    # / Path for which the session cookie is valid
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
  
    nginx.ingress.kubernetes.io/enable-cors: "true"

    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:5173"

    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
    
  labels:
    app.kubernetes.io/name: codespace-ingress

spec:
  ingressClassName: nginx
  rules:

  - http:
      paths:
      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port: 
              number: 80


  - http:
      paths:
      - pathType: Prefix
        path: "/api/sandbox/agent"
        backend:
          service:
            name: router-service
            port:
              number: 80

      - pathType: Prefix
        path: "/api/sandbox/preview"
        backend:
          service:
            name: router-service
            port:
              number: 80

      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port: 
              number: 80
  - http:
      paths:
      - pathType: Prefix
        path: "/api/auth"
        backend:
          service:
            name: auth-service
            port: 
              number: 80

  - host: "*.preview.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80
              

  - host: "*.agent.localhost"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port: 
              number: 80